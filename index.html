function computeZellaScore(m) {
  const winRateScore = Math.max(0, Math.min(100, m.winRate || 0));
  const profitFactorScore = Math.max(0, Math.min(100, (m.profitFactor || 0) / 3 * 100));
  const avgWinLoss = (m.avgLoss && m.avgLoss !== 0) ? Math.abs(m.avgWin / m.avgLoss) : 0;
  const winLossScore = Math.max(0, Math.min(100, avgWinLoss / 3 * 100));
  const drawdownScore = Math.max(0, Math.min(100, 100 - (m.maxDD || 0) * 2));
  const riskRewardScore = Math.max(0, Math.min(100, (m.rrRatio || 0) / 3 * 100));
  const consistencyScore = Math.max(0, Math.min(100, (m.expectancy || 0) >= 0 ? Math.min(100, 50 + (m.kelly || 0)) : Math.max(0, 50 + (m.kelly || 0))));
  const values = [winRateScore, profitFactorScore, winLossScore, drawdownScore, riskRewardScore, consistencyScore];
  const overall = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(2);
  return {
    labels: ['Win Rate', 'Profit Factor', 'Avg Win/Loss', 'Drawdown', 'Risk/Reward', 'Consistencia'],
    values, overall
  };
}

        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              min: 0, max: 100,
              grid: { color: '#2A3140' },
              angleLines: { color: '#2A3140' },
              pointLabels: { color: '#8891A0', font: { size: 9 } },
              ticks: { display: false, backdropColor: 'transparent' }
            }
          }
        }
      });
    }
    const pnlCanvas = document.getElementById('pnl-chart');
    const ddCanvas = document.getElementById('dd-chart');
    const chartTrades = getFilteredTrades();
    if (typeof Chart === 'undefined') {
      // Chart.js no cargó (sin conexión / CDN bloqueado) - degradamos con un aviso en vez de romper la app
      if (pnlCanvas) {
        pnlCanvas.parentElement.innerHTML = '<div class="empty">📡 No se pudo cargar la librería de gráficos (revisa tu conexión a internet)</div>';
      }
      return;
    }
    if (pnlChartInstance) { pnlChartInstance.destroy(); pnlChartInstance = null; }
    if (ddChartInstance) { ddChartInstance.destroy(); ddChartInstance = null; }
    if (pnlCanvas && chartTrades.length > 0) {
      const orderedTrades = chartTrades.slice().reverse(); // cronológico
      const pnlTrend = orderedTrades.map((t, i) => 
        orderedTrades.slice(0, i + 1).reduce((s, x) => s + netProfit(x), 0)
      );
      
      pnlChartInstance = new Chart(pnlCanvas, {
        type: 'line',
        data: {
          labels: orderedTrades.map(t => t.date),
          datasets: [{
            label: 'P&L Acumulado',
            data: pnlTrend,
            borderColor: '#E3A857',
            backgroundColor: 'rgba(227,168,87,0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 3,
            pointBackgroundColor: '#E3A857'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } },
            x: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } }
          }
        }
      });

      // Drawdown desde máximo acumulado: para cada punto, % de caída respecto al peak anterior
      let peak = -Infinity;
      const ddTrend = pnlTrend.map(v => {
        if (v > peak) peak = v;
        // Si peak <= 0 (aún no hay ganancia acumulada), usar drawdown absoluto en $ como referencia
        if (peak <= 0) return v - peak;
        return ((v - peak) / Math.abs(peak)) * 100;
      });

      if (ddCanvas) {
        ddChartInstance = new Chart(ddCanvas, {
          type: 'line',
          data: {
            labels: orderedTrades.map(t => t.date),
            datasets: [{
              label: 'Drawdown %',
              data: ddTrend,
              borderColor: '#C1554A',
              backgroundColor: 'rgba(193,85,74,0.15)',
              fill: true,
              tension: 0.3,
              pointRadius: 2,
              pointBackgroundColor: '#C1554A'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0', callback: v => v.toFixed(0) + '%' } },
              x: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } }
            }
          }
        });
      }
    } else if (ddCanvas) {
      ddCanvas.parentElement.innerHTML = '<div class="empty">Sin trades para calcular drawdown</div>';
    }

    // Histograma de R-Multiple (solo en tab Stats)
    const rmultCanvas = document.getElementById('rmult-chart');
    if (rmultChartInstance) { rmultChartInstance.destroy(); rmultChartInstance = null; }
    if (rmultCanvas) {
      const rTrades = chartTrades.filter(t => t.rMultiple !== null && t.rMultiple !== undefined && !isNaN(t.rMultiple));
      if (rTrades.length > 0) {
        const buckets = [
          { label: '< -2R', min: -Infinity, max: -2, count: 0 },
          { label: '-2R a -1R', min: -2, max: -1, count: 0 },
          { label: '-1R a 0R', min: -1, max: 0, count: 0 },
          { label: '0R a 1R', min: 0, max: 1, count: 0 },
          { label: '1R a 2R', min: 1, max: 2, count: 0 },
          { label: '2R a 3R', min: 2, max: 3, count: 0 },
          { label: '> 3R', min: 3, max: Infinity, count: 0 },
        ];
        rTrades.forEach(t => {
          const b = buckets.find(b => t.rMultiple >= b.min && t.rMultiple < b.max) || buckets[buckets.length - 1];
          b.count++;
        });
        rmultChartInstance = new Chart(rmultCanvas, {
          type: 'bar',
          data: {
            labels: buckets.map(b => b.label),
            datasets: [{
              label: 'Trades',
              data: buckets.map(b => b.count),
              backgroundColor: buckets.map(b => b.max <= 0 ? 'rgba(193,85,74,0.6)' : 'rgba(111,162,135,0.6)'),
              borderColor: buckets.map(b => b.max <= 0 ? '#C1554A' : '#6FA287'),
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0', stepSize: 1 } },
              x: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } }
            }
          }
        });
      } else {
        rmultCanvas.parentElement.innerHTML = '<div class="empty">Sin trades con R Multiple registrado</div>';
      }
    }

    // Comparación de cuentas: P&L acumulado de cada cuenta en el mismo gráfico (solo en tab Cuentas)
    const compareCanvas = document.getElementById('compare-chart');
    if (compareChartInstance) { compareChartInstance.destroy(); compareChartInstance = null; }
    if (compareCanvas) {
      const palette = ['#E3A857', '#6FA287', '#C1554A', '#8891A0', '#7FA7C9', '#B98BC9', '#D9A066', '#5FBFAE'];
      const datasets = accounts.map((acc, idx) => {
        const accTrades = trades.filter(t => t.accountId == acc.id).slice().reverse(); // cronológico
        let running = 0;
        const data = accTrades.map(t => { running += netProfit(t); return running; });
        return {
          label: acc.name,
          data,
          borderColor: palette[idx % palette.length],
          backgroundColor: 'transparent',
          fill: false,
          tension: 0.3,
          pointRadius: 2
        };
      });
      const maxLen = datasets.length ? Math.max(0, ...datasets.map(d => d.data.length)) : 0;
      if (maxLen > 0) {
        compareChartInstance = new Chart(compareCanvas, {
          type: 'line',
          data: {
            labels: Array.from({ length: maxLen }, (_, i) => `#${i + 1}`),
            datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: true, labels: { color: '#8891A0', font: { size: 10 } } } },
            scales: {
              y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } },
              x: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } }
            }
          }
        });
      } else {
        compareCanvas.parentElement.innerHTML = '<div class="empty">Crea al menos una cuenta con trades para comparar</div>';
      }
    }
  }, 50);
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  render();
  renderCharts();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.altKey) {
    const keyMap = { '1': 'dashboard', '2': 'journal', '3': 'analysis', '4': 'stats', '5': 'risk', '6': 'accounts', '7': 'gallery', '8': 'settings' };
    if (keyMap[e.key]) { setTab(keyMap[e.key]); }
  }
  if (e.key === 'Escape') document.getElementById('form-modal').classList.add('hidden');
});

// Re-render when modal is closed
window.addEventListener('beforeunload', saveTrades);
</script>

<script>
function openMacroTerminal(){
  try{
    var b64 = document.getElementById('macro-terminal-data').textContent;
    var binary = atob(b64);
    var len = binary.length;
    var bytes = new Uint8Array(len);
    for (var i=0;i<len;i++){ bytes[i] = binary.charCodeAt(i); }
    var html = new TextDecoder('utf-8').decode(bytes);
    // blob: URLs fallan (aparecen como "blob:null/...") en webviews sin origin propio.
    // document.write directo en la ventana nueva funciona en todos los navegadores.
    var win = window.open('', '_blank');
    if(!win) throw new Error('El navegador bloqueó la ventana emergente (revisa el bloqueador de pop-ups)');
    win.document.open();
    win.document.write(html);
    win.document.close();
  }catch(e){
    alert('No se pudo abrir la Terminal Macro: ' + e.message);
  }
}
</script>
