function renderMonthCalendar(tradesToCalc) {
  const dailyPnL = {}, dailyCount = {};
  tradesToCalc.forEach(t => {
    dailyPnL[t.date] = (dailyPnL[t.date] || 0) + netProfit(t);
    dailyCount[t.date] = (dailyCount[t.date] || 0) + 1;
  });

  const year = calMonthCursor.getFullYear();
  const month = calMonthCursor.getMonth();
  const monthLabel = calMonthCursor.toLocaleDateString('es-CL', { month: 'long', year: 'numeric' });
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay(); // 0=Dom
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Total y P&L del mes visible
  let monthTotal = 0, monthTrades = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if (dailyPnL[dStr] !== undefined) { monthTotal += dailyPnL[dStr]; monthTrades += dailyCount[dStr]; }
  }

  // Construir celdas (incluye relleno antes/después para completar semanas)
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const dayLabels = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  function cellHTML(d) {
    if (d === null) return `<div class="cal-cell empty"></div>`;
    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const pnl = dailyPnL[dStr];
    const cnt = dailyCount[dStr] || 0;
    let cls = 'cal-cell';
    if (pnl !== undefined) cls += pnl > 0 ? ' win' : (pnl < 0 ? ' loss' : ' be');
    return `<div class="${cls}" title="${dStr}" ${pnl !== undefined ? `onclick="showDayTrades('${dStr}')" style="cursor:pointer;"` : ''}>
      <div class="cal-daynum">${d}</div>
      ${pnl !== undefined ? `<div class="cal-pnl">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</div><div class="cal-count">${cnt} trade${cnt!==1?'s':''}</div>` : ''}
    </div>`;
  }

  // Totales por semana (columna derecha)
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  function weekTotalHTML(week) {
    let total = 0, count = 0;
    week.forEach(d => {
      if (d === null) return;
      const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (dailyPnL[dStr] !== undefined) { total += dailyPnL[dStr]; count += dailyCount[dStr]; }
    });
    if (count === 0) return `<div class="cal-week-total empty"></div>`;
    return `<div class="cal-week-total ${total >= 0 ? 'win' : 'loss'}">
      <div class="cal-week-label">Semana</div>
      <div class="cal-week-pnl">${total >= 0 ? '+' : ''}$${total.toFixed(2)}</div>
      <div class="cal-week-count">${count} trade${count!==1?'s':''}</div>
    </div>`;
  }

  let html = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
    <div class="panel-title" style="margin:0;border:none;padding:0;">🗓️ Calendario de Trading</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="btn btn-sm" onclick="changeCalMonth(-1)">◀</button>
      <div style="min-width:150px;text-align:center;text-transform:capitalize;font-weight:700;color:#E3A857;">${monthLabel}</div>
      <button class="btn btn-sm" onclick="changeCalMonth(1)">▶</button>
      <button class="btn btn-sm" onclick="goCalToday()">Hoy</button>
      <span style="margin-left:10px;padding:6px 10px;border-radius:2px;border:1px solid #2A3140;background:#0B0E13;font-weight:700;" class="${monthTotal >= 0 ? 'pnl-pos' : 'pnl-neg'}">
        ${monthTotal >= 0 ? '+' : ''}$${monthTotal.toFixed(2)} · ${monthTrades} trade${monthTrades!==1?'s':''}
      </span>
    </div>
  </div>
  <div class="cal-scroll">
  <div class="cal-grid">
    ${dayLabels.map(l => `<div class="cal-headcell">${l}</div>`).join('')}
    <div class="cal-headcell week-col">Total</div>
    ${weeks.map(week => week.map(d => cellHTML(d)).join('') + weekTotalHTML(week)).join('')}
  </div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;margin-top:10px;font-size:9px;color:#8891A0;">
    <span><span style="display:inline-block;width:10px;height:10px;background:rgba(111,162,135,.35);border:1px solid #6FA287;border-radius:2px;margin-right:4px;"></span>Día ganador</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:rgba(193,85,74,.35);border:1px solid #C1554A;border-radius:2px;margin-right:4px;"></span>Día perdedor</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:rgba(227,168,87,.25);border:1px solid #E3A857;border-radius:2px;margin-right:4px;"></span>Breakeven</span>
  </div>
  `;
  return html;
}

function renderCalendarHeatmap(tradesToCalc) {
  const dailyPnL = {};
  tradesToCalc.forEach(t => {
    dailyPnL[t.date] = (dailyPnL[t.date] || 0) + netProfit(t);
  });

  const days = Object.keys(dailyPnL);
  if (days.length === 0) {
    return `<div class="empty">Sin trades para mostrar el calendario</div>`;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const minDate = new Date(Math.min(...days.map(d => new Date(d + 'T00:00:00').getTime())));
  const maxWeeksBack = 26; // ~6 meses de historial visible
  let startDate = new Date(today);
  startDate.setDate(startDate.getDate() - maxWeeksBack * 7);
  if (minDate > startDate) startDate = new Date(minDate);
  startDate.setDate(startDate.getDate() - startDate.getDay()); // retroceder al domingo

  const maxAbs = Math.max(1, ...days.map(d => Math.abs(dailyPnL[d])));

  function colorFor(pnl) {
    if (pnl === undefined) return '#141922'; // sin trades ese día
    if (pnl === 0) return '#8891A0';
    const intensity = Math.min(1, Math.abs(pnl) / maxAbs);
    const alpha = (0.18 + intensity * 0.72).toFixed(2);
    return pnl > 0 ? `rgba(111,162,135,${alpha})` : `rgba(193,85,74,${alpha})`;
  }

  const weeks = [];
  let cursor = new Date(startDate);
  while (cursor <= today) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      const dStr = cursor.getFullYear() + '-' + String(cursor.getMonth() + 1).padStart(2, '0') + '-' + String(cursor.getDate()).padStart(2, '0'); // fecha local (toISOString desfasa el día según zona horaria)
      week.push({ date: dStr, isFuture: cursor > today, pnl: dailyPnL[dStr] });
      cursor.setDate(cursor.getDate() + 1);
    }
    weeks.push(week);
  }

  const monthLabels = [];
  let lastMonth = null;
  weeks.forEach((week, wi) => {
    const firstDay = new Date(week[0].date + 'T00:00:00');
    const mo = firstDay.getMonth();
    if (mo !== lastMonth) {
      monthLabels.push({ index: wi, label: firstDay.toLocaleDateString('es-CL', { month: 'short' }) });
      lastMonth = mo;
    }
  });

  const dayLabels = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
  const cellSize = 11, gap = 3, colWidth = cellSize + gap;

  let html = `<div style="overflow-x:auto;padding-bottom:4px;">`;
  html += `<div style="position:relative;height:14px;margin-left:20px;margin-bottom:4px;font-size:9px;color:#8891A0;font-family:'IBM Plex Mono',monospace;">`;
  monthLabels.forEach(ml => {
    html += `<span style="position:absolute;left:${ml.index * colWidth}px;">${ml.label}</span>`;
  });
  html += `</div>`;
  html += `<div style="display:flex;gap:${gap}px;">`;
  html += `<div style="display:flex;flex-direction:column;gap:${gap}px;font-size:9px;color:#8891A0;font-family:'IBM Plex Mono',monospace;width:16px;">${dayLabels.map(d => `<div style="height:${cellSize}px;line-height:${cellSize}px;">${d}</div>`).join('')}</div>`;
  weeks.forEach(week => {
    html += `<div style="display:flex;flex-direction:column;gap:${gap}px;">`;
    week.forEach(day => {
      const bg = day.isFuture ? 'transparent' : colorFor(day.pnl);
      const title = day.isFuture ? '' : (day.pnl !== undefined ? `${day.date}: $${day.pnl.toFixed(2)}` : `${day.date}: sin trades`);
      html += `<div title="${title}" style="width:${cellSize}px;height:${cellSize}px;background:${bg};border-radius:2px;${day.isFuture ? '' : 'border:1px solid rgba(255,255,255,0.05);'}"></div>`;
    });
    html += `</div>`;
  });
  html += `</div></div>`;

  html += `<div style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:9px;color:#8891A0;font-family:'IBM Plex Mono',monospace;">
    <span>Pérdida</span>
    <div style="width:10px;height:10px;background:rgba(193,85,74,0.85);border-radius:2px;"></div>
    <div style="width:10px;height:10px;background:rgba(193,85,74,0.35);border-radius:2px;"></div>
    <div style="width:10px;height:10px;background:#8891A0;border-radius:2px;"></div>
    <div style="width:10px;height:10px;background:rgba(111,162,135,0.35);border-radius:2px;"></div>
    <div style="width:10px;height:10px;background:rgba(111,162,135,0.85);border-radius:2px;"></div>
    <span>Ganancia</span>
  </div>`;

  return html;
}

function resultTag(t, verbose = false) {
  const s = tradeSign(t);
  if (s > 0) return `<span class="tag win">${verbose ? '✓ ' : ''}WIN</span>`;
  if (s < 0) return `<span class="tag loss">${verbose ? '✗ ' : ''}LOSS</span>`;
  return `<span class="tag be">${verbose ? '● ' : ''}BE</span>`;
}

function renderTradeCard(t) {
  const hasR = (t.rMultiple !== null && t.rMultiple !== undefined && !isNaN(t.rMultiple));
  const rTag = hasR
    ? `<span class="tag ${t.rMultiple >= 1 ? 'win' : (t.rMultiple < 0 ? 'loss' : '')}">${t.rMultiple >= 0 ? '+' : ''}${t.rMultiple.toFixed(2)}R</span>`
    : '';
  const hasMaxR = (t.maxRMultiple !== null && t.maxRMultiple !== undefined && !isNaN(t.maxRMultiple) && t.maxRMultiple > 0);
  const efficiencyTag = (hasR && hasMaxR)
    ? `<span class="tag" title="Capturaste ${t.rMultiple.toFixed(1)}R de un máximo de ${t.maxRMultiple.toFixed(1)}R">📈 Llegó a ${t.maxRMultiple.toFixed(1)}R${t.riskAmount > 0 ? ` (≈$${(t.maxRMultiple * t.riskAmount).toFixed(0)})` : ''} (capturaste ${Math.min(100, Math.max(0, t.rMultiple / t.maxRMultiple * 100)).toFixed(0)}%)</span>`
    : (hasMaxR ? `<span class="tag">📈 Llegó a ${t.maxRMultiple.toFixed(1)}R</span>` : '');
  const exitTypeMeta = {
    tp: { label: '🎯 Take Profit', cls: 'win' },
    be: { label: '⚖️ Breakeven', cls: 'be' },
    trailing: { label: '📉 Trailing', cls: 'win' },
    manual: { label: '✋ Manual', cls: '' },
    sl: { label: '🛑 Stop Loss', cls: 'loss' },
  };
  const et = exitTypeMeta[t.exitType] || null;
  const exitTypeTag = et ? `<span class="tag ${et.cls}">${et.label}</span>` : '';
  const rrPlannedTag = (t.rrPlanned !== null && t.rrPlanned !== undefined && !isNaN(t.rrPlanned)) ? `<span class="tag">RR 1:${t.rrPlanned}</span>` : '';
  const chartLink = t.chartUrl ? `<a href="${t.chartUrl}" target="_blank" rel="noopener" class="tag" style="text-decoration:none;">📊 Ver gráfico</a>` : '';
  return `
    <div class="trade-card ${tradeSign(t) < 0 ? 'loss' : (tradeSign(t) === 0 ? 'be' : '')}">
      <div class="trade-pnl">${netProfit(t) >= 0 ? '+' : ''}$${netProfit(t).toFixed(2)}${t.cost ? `<div style="font-size:9px;color:#8891A0;font-weight:400;">(bruto $${(t.profit||0).toFixed(2)} - $${t.cost.toFixed(2)} costo)</div>` : ''}</div>
      <div style="flex:1;">
        <div class="trade-meta">
          <span class="trade-pair">${t.pair}</span>
          <span class="tag" style="margin:0;">${accounts.find(a => a.id == t.accountId)?.name || 'Sin asignar'}</span>
          <span class="trade-info">${t.side} • ${t.date} • ${t.session}</span>
        </div>
        <div class="trade-info" style="margin-top:4px;">
          Entrada: ${t.entryPrice} | Salida: ${t.exitPrice} | Qty: ${t.quantity}${t.riskAmount ? ` | Riesgo: $${t.riskAmount}` : ''}
        </div>
        <div class="trade-notes">${t.notes || 'Sin notas'}</div>
        <div>
          <span class="tag">${t.model || 'N/A'}</span>
          <span class="tag">${t.timeframe || 'N/A'}</span>
          ${exitTypeTag}
          ${rrPlannedTag}
          ${resultTag(t, true)}
          ${rTag}
          ${efficiencyTag}
          ${chartLink}
        </div>
      </div>
      <div style="text-align:right;">
        <button class="btn btn-sm" onclick="editTrade('${t.id}')">Editar</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTrade('${t.id}')">Borrar</button>
      </div>
    </div>
  `;
}

// ===== VALIDACIÓN DE ESTRATEGIA (edge en R, muestra, riesgo, consistencia) =====
function tCrit95(df) {
  if (df >= 120) return 1.98; if (df >= 60) return 2.0; if (df >= 30) return 2.04;
  if (df >= 20) return 2.09; if (df >= 15) return 2.13; if (df >= 10) return 2.23;
  if (df >= 5) return 2.57; return 4.3;
}
function groupExpR(list, keyFn) {
  const g = {};
  list.forEach(t => {
    if (t.rMultiple === null || t.rMultiple === undefined || isNaN(t.rMultiple)) return;
    const k = keyFn(t) || 'Sin asignar';
    (g[k] = g[k] || []).push({ r: t.rMultiple, usd: netProfit(t) });
  });
  return Object.entries(g).map(([k, a]) => ({
    key: k, n: a.length,
    exp: a.reduce((s, x) => s + x.r, 0) / a.length,
    expUsd: a.reduce((s, x) => s + x.usd, 0) / a.length,
    pnlUsd: a.reduce((s, x) => s + x.usd, 0),
    wr: a.filter(x => x.r > 0).length / a.length * 100
  })).sort((x, y) => y.exp - x.exp);
}
function renderEdgePanel(compact = false) {
  const all = getFilteredTrades();
  if (all.length === 0) return '';
  const chrono = chronoTrades(all); // más antiguo -> más reciente, por fecha
  const hasR = t => t.rMultiple !== null && t.rMultiple !== undefined && !isNaN(t.rMultiple);
  const rTr = chrono.filter(hasR);
  const rs = rTr.map(t => t.rMultiple);
  const n = rs.length;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const item = (label, val, cls = '', sub = '') => `<div class="stat-item"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${val}${sub ? ` <span style="color:#8891A0;font-size:9px;">${sub}</span>` : ''}</div></div>`;
  if (n === 0) return `<div class="panel" style="margin-bottom:16px;"><div class="panel-title">🧪 Validación de Estrategia</div><div class="empty">Carga "Riesgo del trade ($)" en tus trades para activar el análisis en R.</div></div>`;

  // Edge en R
  const mean = rs.reduce((s, x) => s + x, 0) / n;
  const sd = n > 1 ? Math.sqrt(rs.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1)) : 0;
  const ci = n > 1 ? tCrit95(n - 1) * sd / Math.sqrt(n) : 0;
  const lo = mean - ci, hi = mean + ci;
  const sqn = sd > 0 ? Math.sqrt(Math.min(n, 100)) * mean / sd : 0;
  const winsR = rs.filter(x => x > 0), lossR = rs.filter(x => x < 0);
  const avgWinR = winsR.length ? winsR.reduce((s, x) => s + x, 0) / winsR.length : 0;
  const avgLossR = lossR.length ? Math.abs(lossR.reduce((s, x) => s + x, 0) / lossR.length) : 0;
  // Win rate sobre trades decisivos (sin BE) para compararlo de forma exacta con el equilibrio L/(W+L).
  const wrR = (winsR.length + lossR.length) > 0 ? winsR.length / (winsR.length + lossR.length) * 100 : 0;
  const wrAll = winsR.length / n * 100;
  const beWR = (avgWinR + avgLossR) > 0 ? avgLossR / (avgWinR + avgLossR) * 100 : 0;
  const payoff = avgLossR > 0 ? avgWinR / avgLossR : 0;

  // Rachas máximas (todos los trades; BE corta la racha)
  let maxW = 0, maxL = 0, cw = 0, cl = 0;
  chrono.forEach(t => {
    const s = tradeSign(t);
    if (s > 0) { cw++; cl = 0; } else if (s < 0) { cl++; cw = 0; } else { cw = 0; cl = 0; }
    maxW = Math.max(maxW, cw); maxL = Math.max(maxL, cl);
  });
  // Mismas rachas pero en dólares: suma de los trades seguidos (la peor racha perdedora y la mejor ganadora)
  let sumW = 0, sumL = 0, bestWinUsd = 0, worstLossUsd = 0;
  let sumWR = 0, sumLR = 0, bestWinRStreak = 0, worstLossRStreak = 0;
  chrono.forEach(t => {
    const sg = tradeSign(t), p = netProfit(t), rr = Number.isFinite(t.rMultiple) ? t.rMultiple : 0;
    if (sg > 0) { sumW += p; sumWR += rr; sumL = 0; sumLR = 0; } else if (sg < 0) { sumL += p; sumLR += rr; sumW = 0; sumWR = 0; } else { sumW = 0; sumL = 0; sumWR = 0; sumLR = 0; }
    bestWinUsd = Math.max(bestWinUsd, sumW); worstLossUsd = Math.min(worstLossUsd, sumL);
    bestWinRStreak = Math.max(bestWinRStreak, sumWR); worstLossRStreak = Math.min(worstLossRStreak, sumLR);
  });
  const q = lossR.length / n;   // prob. de perder
  const pw = winsR.length / n;  // prob. de ganar
  // Racha esperable en N trades, EXACTA (programación dinámica, sin simulación):
  // típico = valor al que se llega la mitad de las veces; p90 = 9 de cada 10 tandas de N trades quedan por debajo o igual.
  // Supone trades independientes y usa tu % real (de pérdidas o de ganancias). BE corta la racha.
  const streakStats = (pr, N) => {
    if (!(pr > 0 && pr < 1) || !(N >= 1)) return null;
    const probMaxAtMost = k => { // P(racha máxima <= k en N trades)
      let dp = new Array(k + 1).fill(0); dp[0] = 1;
      for (let i = 0; i < N; i++) {
        const nx = new Array(k + 1).fill(0);
        for (let r = 0; r <= k; r++) {
          if (!dp[r]) continue;
          nx[0] += dp[r] * (1 - pr);
          if (r + 1 <= k) nx[r + 1] += dp[r] * pr;
        }
        dp = nx;
      }
      return dp.reduce((a, b) => a + b, 0);
    };
    let typical = null, p90 = null;
    for (let k = 1; k <= N; k++) {
      const p = probMaxAtMost(k);
      if (typical === null && p >= 0.5) typical = k;
      if (p >= 0.9) { p90 = k; break; }
    }
    return { typical, p90 };
  };
  const HORIZON = 100;
  const lossStreakStats = streakStats(q, HORIZON);
  const winStreakStats = streakStats(pw, HORIZON);
  // Mismo cálculo pero con TUS trades actuales (n): sirve para comparar tu racha real contra lo esperable
  // en el mismo número de trades. Solo se omite cuando n es exactamente 100 (ya coincide con el horizonte).
  const horizonN = Math.max(HORIZON, n); // 100 como mínimo; desde 100 trades en adelante crece con tu historial
  const lossStatsN = streakStats(q, horizonN);
  const winStatsN = streakStats(pw, horizonN);

  // Curva y drawdown en R
  let cum = 0, peak = 0, maxDDR = 0, sincePeak = 0;
  const curve = [0];
  rTr.forEach(t => {
    cum += t.rMultiple; curve.push(cum);
    if (cum > peak) { peak = cum; sincePeak = 0; } else sincePeak++;
    maxDDR = Math.max(maxDDR, peak - cum);
  });
  const curDDR = peak - cum;

  // Días y semanas ganadoras (P&L neto)
  const day = {}, wk = {};
  chrono.forEach(t => {
    const p = netProfit(t);
    day[t.date] = (day[t.date] || 0) + p;
    const d = new Date(t.date + 'T00:00:00');
    if (isNaN(d)) return;
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const k = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    wk[k] = (wk[k] || 0) + p;
  });
  const dv = Object.values(day), wv = Object.values(wk);
  const pctDays = dv.length ? dv.filter(x => x > 0).length / dv.length * 100 : 0;
  const pctWeeks = wv.length ? wv.filter(x => x > 0).length / wv.length * 100 : 0;
  const bestDay = dv.length ? Math.max(...dv) : 0, worstDay = dv.length ? Math.min(...dv) : 0;

  // ===== Equivalentes en dólares (mismos trades con R) y como % del capital inicial de la(s) cuenta(s) =====
  const capital = getStartBalance(all);
  const usd = rTr.map(t => netProfit(t));
  const sumUsd = usd.reduce((a, x) => a + x, 0);
  const meanUsd = sumUsd / n;
  const sdUsd = n > 1 ? Math.sqrt(usd.reduce((a, x) => a + (x - meanUsd) ** 2, 0) / (n - 1)) : 0;
  const ciUsd = n > 1 ? tCrit95(n - 1) * sdUsd / Math.sqrt(n) : 0;
  const winsUsd = usd.filter(x => x > 0), lossUsd = usd.filter(x => x < 0);
  const avgWinUsd = winsUsd.length ? winsUsd.reduce((a, x) => a + x, 0) / winsUsd.length : 0;
  const avgLossUsd = lossUsd.length ? Math.abs(lossUsd.reduce((a, x) => a + x, 0) / lossUsd.length) : 0;
  let eqU = 0, peakU = 0, maxDDU = 0;
  rTr.forEach(t => { eqU += netProfit(t); peakU = Math.max(peakU, eqU); maxDDU = Math.max(maxDDU, peakU - eqU); });
  const curDDU = peakU - eqU;
  const money = v => (v < 0 ? '-' : '+') + '$' + Math.abs(v).toFixed(2);
  const ddMoney = v => (v > 0 ? '-$' + v.toFixed(2) : '$0.00');
  const pctCap = v => (capital > 0 ? (v / capital * 100).toFixed(2) + '%' : '—');
  const hasOrphan = all.some(t => !accounts.find(a => a.id == t.accountId));
  const streakSub = isL => {
    const sg = isL ? '-' : '+';
    const aR = isL ? avgLossR : avgWinR, aU = isL ? avgLossUsd : avgWinUsd;
    const bestU = isL ? worstLossUsd : bestWinUsd, bestR = isL ? worstLossRStreak : bestWinRStreak;
    const st = isL ? lossStatsN : winStatsN;
    const one = k => aU > 0 ? `${k} ≈ ${sg}${(k * aR).toFixed(1)}R / ${sg}$${(k * aU).toFixed(0)}` : `${k}`;
    const lines = [];
    if (bestU !== 0) lines.push(`${isL ? 'peor' : 'mejor'} racha: ${sg}$${Math.abs(bestU).toFixed(2)} / ${sg}${Math.abs(bestR).toFixed(1)}R` + (!isL && capital > 0 ? ` · +${pctCap(bestU)} del capital` : ''));
    if (st) {
      lines.push(`normal en ${horizonN} trades: ~${one(st.typical)}`);
      lines.push(`hasta ${one(st.p90)}` + (isL && aU > 0 && capital > 0 ? ` (${(st.p90 * aU / capital * 100).toFixed(1)}% del capital)` : ''));
    }
    if (!lines.length) return '';
    lines[0] = '(' + lines[0];
    lines[lines.length - 1] += ')';
    return '<br>' + lines.join('<br>');
  };
  const lossStreakSub = streakSub(true);
  const winStreakSub = streakSub(false);

  // Drawdown esperable (bootstrap): se remuestrean tus propios trades (con reemplazo) en tandas del mismo horizonte
  // que las rachas, y se mide el drawdown máximo de cada tanda. normal = mediana, hasta = percentil 90.
  // Semilla fija: el número no cambia al recargar si no agregas trades.
  const ddSim = (() => {
    if (n < 5) return null;
    const N = horizonN, S = N > 1000 ? 1000 : 2000;
    let seed = 123456789;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const ddRs = [], ddUs = [];
    for (let s = 0; s < S; s++) {
      let cR = 0, pR = 0, mR = 0, cU = 0, pU = 0, mU = 0;
      for (let i = 0; i < N; i++) {
        const k = Math.floor(rnd() * n);
        cR += rTr[k].rMultiple; if (cR > pR) pR = cR; if (pR - cR > mR) mR = pR - cR;
        cU += usd[k]; if (cU > pU) pU = cU; if (pU - cU > mU) mU = pU - cU;
      }
      ddRs.push(mR); ddUs.push(mU);
    }
    const pick = (a, p) => { const b = a.slice().sort((x, y) => x - y); return b[Math.min(b.length - 1, Math.floor(p * b.length))]; };
    return { nR: pick(ddRs, 0.5), hR: pick(ddRs, 0.9), nU: pick(ddUs, 0.5), hU: pick(ddUs, 0.9) };
  })();
  const ddSub = ddSim ? `<br>(normal en ${horizonN} trades: -${ddSim.nR.toFixed(1)}R / -$${ddSim.nU.toFixed(0)}<br>hasta -${ddSim.hR.toFixed(1)}R / -$${ddSim.hU.toFixed(0)}${capital > 0 ? ` (${(ddSim.hU / capital * 100).toFixed(1)}% del capital)` : ''})` : '';
  // Factor de recuperación = ganancia neta / drawdown máximo (ambos en $, sobre los mismos trades con R)
  const recFactor = maxDDU > 0 ? sumUsd / maxDDU : null;
  // Kelly (mismo cálculo que el anillo Kelly del dashboard: W - (1-W)/payoff en R, sobre tus trades con R)
  const kellyFull = settings.useKelly === true ? kellyScenario().full : 0;
  const kDiv = settings.kellyDiv || 4;
  const kellyFrac = kellyFull / kDiv;
  const avgRiskUsd = rTr.reduce((a, t) => a + (t.riskAmount > 0 ? t.riskAmount : 0), 0) / n;
  const kellyItem = (() => {
    const useK = settings.useKelly === true;
    const btn = (label, val) => `<button onclick="setUseKelly(${val})" style="${useK === val ? 'background:#E3A857;color:#0B0E13;' : 'background:#1B212C;color:inherit;'}border:1px solid #2A3140;border-radius:4px;padding:2px 12px;font:inherit;cursor:pointer;margin-left:4px;">${label}</button>`;
    const toggle = `¿Usar Kelly? ${btn('Sí', true)}${btn('No', false)}`;
    if (!useK) return item('Kelly (riesgo por trade)', 'Desactivado', '', '<br>' + toggle);
    if (kellyFull <= 0) return item('Kelly (riesgo por trade)', '0%', 'red', '<br>' + toggle + '<br>(sin ventaja: se usan tus datos reales)');
    const sel = `<select onchange="setKellyDiv(this.value)" style="background:#1B212C;color:inherit;border:1px solid #2A3140;border-radius:4px;padding:1px 4px;font:inherit;cursor:pointer;">${[2, 4, 6, 8].map(d => `<option value="${d}" ${kDiv === d ? 'selected' : ''}>1/${d}</option>`).join('')}</select>`;
    const lines = [
      `usando ${sel} Kelly: ${kellyFrac.toFixed(2)}% del capital por trade (≈ $${(kellyFrac / 100 * capital).toFixed(0)})`
    ];
    const scn = kellyScenario();
    if (!scn.active) lines.push(`Sin trades con "Riesgo Kelly (%)": se usan tus resultados reales.`);
    if (scn.active) lines.push(`Simulación activa · capital final: $${scn.endEq.toFixed(0)}`);
    const maxRisk = parseFloat(settings.maxRiskPerTrade) || 0;
    if (maxRisk > 0 && kellyFrac > maxRisk) lines.push(`⚠ supera tu límite de ${maxRisk}% por trade: no pases de ${maxRisk}% ≈ $${(maxRisk / 100 * capital).toFixed(0)}`);
    lines[0] = '(' + lines[0]; lines[lines.length - 1] += ')';
    return item('Kelly (riesgo por trade)', kellyFrac.toFixed(2) + '% del capital', 'green', '<br>' + toggle + '<br>' + lines.join('<br>'));
  })();

  const fixedItem = (() => {
    const on = settings.useFixed === true;
    const btn = (label, val) => `<button onclick="setUseFixed(${val})" style="${on === val ? 'background:#E3A857;color:#0B0E13;' : 'background:#1B212C;color:inherit;'}border:1px solid #2A3140;border-radius:4px;padding:2px 12px;font:inherit;cursor:pointer;margin-left:4px;">${label}</button>`;
    const toggle = `¿Riesgo fijo (sin Kelly)? ${btn('Sí', true)}${btn('No', false)}`;
    if (!on) return item('Riesgo fijo (escenario)', 'Desactivado', '', '<br>' + toggle);
    const f = parseFloat(settings.fixedRisk) > 0 ? parseFloat(settings.fixedRisk) : 1;
    const inp = `<input type="number" step="0.1" min="0" value="${f}" onchange="setFixedRisk(this.value)" style="width:56px;background:#1B212C;color:inherit;border:1px solid #2A3140;border-radius:4px;padding:1px 4px;font:inherit;">`;
    const cur = riskSim(f);
    const cmp = [1, 2, 3, 4, 5].map(p => { const s = riskSim(p); return `${p}%: $${s.endEq.toFixed(0)} · DD máx -${s.maxDD.toFixed(1)}%`; });
    const lines = [
      `(total por día ${inp} % del capital (≈ $${(f / 100 * cur.startBal).toFixed(0)}) · capital final: $${cur.endEq.toFixed(0)} · DD máx -${cur.maxDD.toFixed(1)}%`,
      `Comparar: ${cmp.join(' | ')})`
    ];
    return item('Riesgo fijo (escenario)', f + '% por día', 'green', '<br>' + toggle + '<br>' + lines.join('<br>'));
  })();

  // Veredicto
  let verdict, vcol;
  if (n < 30) { verdict = `No concluyente: faltan trades (tienes ${n} con R, mínimo 30)`; vcol = '#E3A857'; }
  else if (lo > 0) { verdict = 'Ventaja estadística: expectancy positivo con 95% de confianza'; vcol = '#6FA287'; }
  else if (hi < 0) { verdict = 'Sin ventaja: expectancy negativo con 95% de confianza'; vcol = '#C1554A'; }
  else { verdict = 'No concluyente: el rango de confianza cruza 0, necesitas más trades'; vcol = '#E3A857'; }
  const nLabel = n < 30 ? 'Insuficiente' : n < 100 ? 'Media' : 'Alta';

  // Curvas de equity (SVG): en R y en dólares (capital inicial + P&L acumulado, mismos trades)
  const mkSvg = (arr, base, up) => {
    const W = 600, H = 140, pad = 6;
    const mn = Math.min(...arr, base), mx = Math.max(...arr, base), span = (mx - mn) || 1;
    const X = i => pad + i / ((arr.length - 1) || 1) * (W - 2 * pad);
    const Y = v => H - pad - (v - mn) / span * (H - 2 * pad);
    const pts = arr.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:140px;background:#0B0E13;border:1px solid #2A3140;"><line x1="0" y1="${Y(base).toFixed(1)}" x2="${W}" y2="${Y(base).toFixed(1)}" stroke="#2A3140" stroke-dasharray="4"/><polyline points="${pts}" fill="none" stroke="${up ? '#6FA287' : '#C1554A'}" stroke-width="2"/></svg>`;
  };
  const svg = mkSvg(curve, 0, cum >= 0);
  let accU = capital; const curveUsd = [capital];
  rTr.forEach(t => { accU += netProfit(t); curveUsd.push(accU); });
  const svgUsd = mkSvg(curveUsd, capital, accU >= capital);

  const tbl = (title, rows) => `<div class="panel"><div class="panel-title">${title}</div>${rows.length ? `<table class="rt-table"><thead><tr><th>${title.includes('Par') ? 'Par' : 'Modelo'}</th><th>Trades</th><th>Win Rate</th><th>Expectancy R</th><th>Expectancy $</th><th>P&amp;L total $</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.key)}${r.n < 10 ? ' ⚠' : ''}</td><td>${r.n}</td><td>${r.wr.toFixed(1)}%</td><td class="${r.exp >= 0 ? 'pnl-pos' : 'pnl-neg'}">${r.exp >= 0 ? '+' : ''}${r.exp.toFixed(2)}R</td><td class="${r.expUsd >= 0 ? 'pnl-pos' : 'pnl-neg'}">${r.expUsd >= 0 ? '+' : '-'}$${Math.abs(r.expUsd).toFixed(2)}</td><td class="${r.pnlUsd >= 0 ? 'pnl-pos' : 'pnl-neg'}">${r.pnlUsd >= 0 ? '+' : '-'}$${Math.abs(r.pnlUsd).toFixed(2)}</td></tr>`).join('')}</tbody></table><div style="font-size:9px;color:#8891A0;margin-top:6px;">⚠ = menos de 10 trades, no confiable</div>` : '<div class="empty">Sin datos</div>'}</div>`;

  if (compact) {
    return `
    <div class="panel" style="margin-bottom:14px;border-left:3px solid ${vcol};">
      <div class="panel-title">🧪 Validación de Estrategia · ${n} trades con R (${nLabel})</div>
      <div style="font-size:13px;font-weight:700;color:${vcol};margin-bottom:8px;">${verdict}</div>
      <div class="stats-list" style="margin-top:0;">
        ${item('Expectancy (R/trade)', (mean >= 0 ? '+' : '') + mean.toFixed(2) + 'R', mean >= 0 ? 'green' : 'red', `IC 95%: ${lo.toFixed(2)} a ${hi.toFixed(2)}`)}
        ${item('Win rate vs equilibrio', wrR.toFixed(1) + '% / ' + beWR.toFixed(1) + '%', wrR >= beWR ? 'green' : 'red', `margen ${(wrR - beWR >= 0 ? '+' : '') + (wrR - beWR).toFixed(1)} pts`)}
        ${item('Ganancia / Pérdida prom.', `${avgWinR.toFixed(2)}R / -${avgLossR.toFixed(2)}R`)}
        ${item('SQN', sqn.toFixed(2), sqn >= 1.6 ? 'green' : (sqn < 0 ? 'red' : 'neutral'))}
        ${item('Drawdown actual / máx. (R)', (curDDR > 0 ? '-' : '') + curDDR.toFixed(2) + 'R / -' + maxDDR.toFixed(2) + 'R', curDDR > 0 ? 'red' : 'green')}
        ${item('Racha máx. perdedora', maxL, 'red', lossStatsN ? `(esperable en ${horizonN} trades: normal ${lossStatsN.typical}, hasta ${lossStatsN.p90})` : '')}
      </div>
    </div>`;
  }
  return `
    <div class="panel" style="margin-bottom:16px;border-left:3px solid ${vcol};">
      <div class="panel-title">🧪 Validación de Estrategia (en R)</div>
      <div style="font-size:13px;font-weight:700;color:${vcol};margin-bottom:8px;">${verdict}</div>
      <div style="font-size:10px;color:#8891A0;margin-bottom:8px;">Muestra: ${n} trades con R · Confianza de la muestra: ${nLabel}</div>
      ${svg}
      <div style="font-size:9px;color:#8891A0;margin:4px 0 10px;">Curva de equity acumulada en R (solo trades con riesgo cargado)</div>
      ${svgUsd}
      <div style="font-size:9px;color:#8891A0;margin:4px 0 10px;">Curva de capital en dólares: $${capital.toFixed(0)} iniciales + P&amp;L acumulado de esos mismos trades (línea punteada = capital inicial)</div>
      <div class="stats-list">
        ${item('Expectancy (R/trade)', (mean >= 0 ? '+' : '') + mean.toFixed(2) + 'R', mean >= 0 ? 'green' : 'red', `(${money(meanUsd)}/trade · ${pctCap(meanUsd)} del capital)`)}
        ${item('Intervalo 95%', `${lo.toFixed(2)}R a ${hi.toFixed(2)}R`, lo > 0 ? 'green' : (hi < 0 ? 'red' : 'neutral'), `(${money(meanUsd - ciUsd)} a ${money(meanUsd + ciUsd)} por trade)`)}
        ${item('Resultado sobre capital inicial', money(sumUsd), sumUsd >= 0 ? 'green' : 'red', `(${pctCap(sumUsd)} sobre $${capital.toFixed(0)} iniciales${hasOrphan ? ' · incluye trades de cuenta borrada, sin su capital' : ''})`)}
        ${item('SQN', sqn.toFixed(2), sqn >= 1.6 ? 'green' : (sqn < 0 ? 'red' : 'neutral'), n < 30 ? '(muestra baja)' : '')}
        ${item('Desv. estándar R', sd.toFixed(2) + 'R', '', `($${sdUsd.toFixed(2)} por trade)`)}
        ${item('Win rate real (sin BE)', wrR.toFixed(1) + '%', '', Math.abs(wrAll - wrR) > 0.05 ? `(con BE: ${wrAll.toFixed(1)}%)` : '')}
        ${item('Win rate de equilibrio', beWR.toFixed(1) + '%', wrR >= beWR ? 'green' : 'red', `margen ${(wrR - beWR >= 0 ? '+' : '') + (wrR - beWR).toFixed(1)} pts`)}
        ${item('Ganancia prom. / Pérdida prom.', `${avgWinR.toFixed(2)}R / -${avgLossR.toFixed(2)}R`, '', `(+$${avgWinUsd.toFixed(2)} / -$${avgLossUsd.toFixed(2)})`)}
        ${item('Payoff (R)', payoff.toFixed(2), payoff >= 1 ? 'green' : 'neutral', avgLossUsd > 0 ? `(en $: ${(avgWinUsd / avgLossUsd).toFixed(2)})` : '')}
        ${item('Racha máx. ganadora', maxW, 'green', winStreakSub)}
        ${item('Racha máx. perdedora', maxL, 'red', lossStreakSub)}
        ${item('Drawdown actual (R)', (curDDR > 0 ? '-' : '') + curDDR.toFixed(2) + 'R', curDDR > 0 ? 'red' : 'green', `(${ddMoney(curDDU)} · ${curDDU > 0 ? '-' : ''}${pctCap(curDDU)} del capital${sincePeak ? ` · ${sincePeak} trades sin nuevo máximo` : ' · en máximo'})`)}
        ${item('Drawdown máx. (R)', (maxDDR > 0 ? '-' : '') + maxDDR.toFixed(2) + 'R', maxDDR > 0 ? 'red' : 'green', `(${ddMoney(maxDDU)} · ${maxDDU > 0 ? '-' : ''}${pctCap(maxDDU)} del capital)`)}
        ${ddSim ? item('Drawdown esperable', '-' + ddSim.nR.toFixed(1) + 'R', 'red', ddSub) : ''}
        ${recFactor !== null ? item('Factor de recuperación', recFactor.toFixed(2), recFactor >= 1 ? 'green' : 'red', `(${recFactor < 1 ? 'malo' : recFactor < 3 ? 'aceptable' : 'bueno'} · ganancia ÷ peor caída · menos de 1 malo, 1 a 3 aceptable, más de 3 bueno)`) : ''}
        ${kellyItem}
        ${fixedItem}
        ${item('Días ganadores', pctDays.toFixed(0) + '%', '', `(${dv.length} días)`)}
        ${item('Semanas ganadoras', pctWeeks.toFixed(0) + '%', '', `(${wv.length} sem.)`)}
        ${item('Mejor día', '$' + bestDay.toFixed(2), 'green')}
        ${item('Peor día', '$' + worstDay.toFixed(2), 'red')}
      </div>
    </div>
    <div class="grid-2">
      ${tbl('Expectancy R por Par', groupExpR(all, t => t.pair))}
      ${tbl('Expectancy R por Modelo', groupExpR(all, t => t.model))}
    </div>`;
}

// Resume el desempeño de los últimos 7 y 30 días en texto plano, comparando contra el resto del historial.
function renderPeriodReport() {
  const all = getFilteredTrades();
  if (all.length === 0) return '<div class="empty">Sin trades aún.</div>';
  const now = new Date();
  const dayStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const c7 = new Date(now); c7.setDate(c7.getDate() - 6);   // hoy + 6 días previos = 7 días
  const c30 = new Date(now); c30.setDate(c30.getDate() - 29); // hoy + 29 días previos = 30 días
  const cutoff7 = dayStr(c7), cutoff30 = dayStr(c30);

  function summarize(list) {
    if (list.length === 0) return null;
    const pnl = list.reduce((s, t) => s + netProfit(t), 0);
    const wins = list.filter(t => tradeSign(t) > 0).length;
    const wr = (wins / list.length * 100).toFixed(1);
    const byModelCount = {};
    list.forEach(t => { const mo = t.model || 'Sin asignar'; byModelCount[mo] = (byModelCount[mo] || 0) + netProfit(t); });
    const bestModel = Object.entries(byModelCount).sort((a, b) => b[1] - a[1])[0];
    const worstModel = Object.entries(byModelCount).sort((a, b) => a[1] - b[1])[0];
    return { count: list.length, pnl, wr, bestModel, worstModel };
  }

  const w7 = summarize(all.filter(t => t.date >= cutoff7));
  const w30 = summarize(all.filter(t => t.date >= cutoff30));

  function block(title, s) {
    if (!s) return `<div style="margin-bottom:14px;"><div class="panel-title" style="font-size:11px;">${title}</div><div class="empty" style="padding:8px 0;">Sin trades en este período</div></div>`;
    return `<div style="margin-bottom:14px;">
      <div class="panel-title" style="font-size:11px;">${title}</div>
      <div style="font-size:12px;line-height:1.7;">
        ${s.count} trades · P&L <span class="${s.pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">$${s.pnl.toFixed(2)}</span> · Win ${s.wr}%<br>
        ${s.bestModel ? `Mejor setup: <b>${s.bestModel[0]}</b> ($${s.bestModel[1].toFixed(2)})` : ''}
        ${s.worstModel && s.worstModel[0] !== s.bestModel[0] ? `<br>Peor setup: <b>${s.worstModel[0]}</b> ($${s.worstModel[1].toFixed(2)})` : ''}
      </div>
    </div>`;
  }

  return block('Últimos 7 días', w7) + block('Últimos 30 días', w30);
}

  return `

// ========== HANDLERS ==========
function saveTrade() {
  const accountId = document.getElementById('trade_account').value;
  const acc0 = accounts.find(a => a.id == accountId);
  
  const trade = {
    id: Date.now(),
    accountId: accountId,
    date: document.getElementById('trade_date').value,
    pair: canonicalPair(document.getElementById('trade_pair').value),
    side: document.getElementById('trade_side').value,
    entryPrice: parseFloat(document.getElementById('trade_entry').value),
    exitPrice: parseFloat(document.getElementById('trade_exit').value),
    quantity: parseFloat(document.getElementById('trade_qty').value),
    session: document.getElementById('trade_session').value,
    riskAmount: parseFloat(document.getElementById('trade_risk').value) || 0,
    kPct: parseFloat(document.getElementById('trade_kpct').value) || 0,
    maxRMultiple: parseFloat(document.getElementById('trade_max_r').value) || null,
    model: document.getElementById('trade_model').value,
    exitType: document.getElementById('trade_exit_type').value,
    rrPlanned: parseFloat(document.getElementById('trade_rr_planned').value) || null,
    timeframe: document.getElementById('trade_tf').value,
    notes: document.getElementById('trade_notes').value,
    chartUrl: document.getElementById('trade_chart_url').value.trim(),
    // Costo real (comisión+swap) de ESTE trade. Solo aplica en cuentas Live/Fondeada.
    cost: (acc0 && COST_APPLICABLE_TYPES.includes(acc0.type)) ? (parseFloat(document.getElementById('trade_cost').value) || 0) : 0,
  };

  // Calculate profit (bruto): si el usuario escribió la ganancia en $ manualmente, esa manda.
  // Si no, se calcula automático con Entrada/Salida/Cantidad (asume que el precio ya está en $/unidad).
  const manualProfit = document.getElementById('trade_profit_usd').value;
  if (manualProfit !== '' && !isNaN(parseFloat(manualProfit))) {
    trade.profit = parseFloat(manualProfit);
  } else {
    const priceDiff = trade.exitPrice - trade.entryPrice;
    const multiplier = trade.side === 'SHORT' ? -1 : 1;
    trade.profit = priceDiff * multiplier * trade.quantity;
  }

  // Calculate R Multiple realizado (si se definió riesgo) - sobre el profit bruto, como venía
  trade.rMultiple = trade.riskAmount > 0 ? trade.profit / trade.riskAmount : null;

  if (!accountId || !trade.pair || !trade.date || isNaN(trade.entryPrice) || isNaN(trade.exitPrice) || isNaN(trade.quantity)) {
    showToast('Completa todos los campos incluida la cuenta', 'error');
    return;
  }

  // ¿El nombre se parece a un activo que ya usas? (probable error de tipeo)
  const sugg = suggestPair(trade.pair);
  if (sugg && confirm(`"${trade.pair}" no está en tu lista. ¿Quisiste decir "${sugg}"?\n\nAceptar = usar ${sugg}\nCancelar = mantener ${trade.pair}`)) trade.pair = sugg;

  // VALIDACIÓN: lado/precios/tipo de salida/R coherentes entre sí
  const issues = checkTradeConsistency(trade);
  if (issues.length > 0 && !confirm('⚠️ Revisa estos datos antes de guardar:\n\n• ' + issues.join('\n• ') + '\n\n¿Guardar de todos modos?')) return;

  // ALERTA DE RIESGO PRE-SAVE
  const risks = checkRiskAlert(trade);
  if (risks.length > 0) {
    const riskMsg = risks.map(r => r.msg).join('\n\n');
    if (!confirm(`Alertas de riesgo:\n\n${riskMsg}\n\n¿Guardar de todas formas?`)) return;
  }

  trades.unshift(trade);
  
  // Actualizar balance de la cuenta con el P&L neto (profit - costo real)
  const acc = accounts.find(a => a.id == accountId);
  if (acc) {
    acc.currentBalance = (parseFloat(acc.currentBalance || acc.startBalance) + netProfit(trade)).toFixed(2);
  }
  
  saveTrades();
  saveAccounts();
  toggleFormModal();
  showToast('Trade agregado correctamente', 'success');
  render();
}

function editTrade(id) {
  const trade = trades.find(t => t.id == id);
  if (!trade) return;
  
  toggleFormModal(true);
  
  // Esperar a que el modal se renderice
  setTimeout(() => {
    document.getElementById('trade_account').value = trade.accountId;
    document.getElementById('trade_date').value = trade.date;
    document.getElementById('trade_pair').value = trade.pair;
    document.getElementById('trade_side').value = trade.side;
    document.getElementById('trade_entry').value = trade.entryPrice;
    document.getElementById('trade_exit').value = trade.exitPrice;
    document.getElementById('trade_qty').value = trade.quantity;
    document.getElementById('trade_session').value = trade.session;
    document.getElementById('trade_risk').value = trade.riskAmount || '';
    document.getElementById('trade_kpct').value = trade.kPct || '';
    document.getElementById('trade_max_r').value = trade.maxRMultiple || '';
    document.getElementById('trade_model').value = trade.model;
    document.getElementById('trade_exit_type').value = trade.exitType || 'manual';
    document.getElementById('trade_rr_planned').value = trade.rrPlanned || '';
    document.getElementById('trade_tf').value = trade.timeframe;
    document.getElementById('trade_notes').value = trade.notes;
    document.getElementById('trade_chart_url').value = trade.chartUrl || '';
    document.getElementById('trade_profit_usd').value = (trade.profit !== undefined && trade.profit !== null) ? trade.profit : '';
    onTradeAccountChange();
    const costInput = document.getElementById('trade_cost');
    if (costInput && trade.cost !== undefined && trade.cost !== null) {
      costInput.value = trade.cost;
      costInput.dataset.userEdited = '1'; // no pisar con el promedio de la cuenta
    }
    
    // Actualizar button
    const title = document.querySelector('.modal-box .modal-title');
    title.textContent = `Editar Trade - ${trade.pair} ${trade.date}`;
    
    const saveBtn = document.querySelector('.modal-box .btn-primary');
    const newSave = saveBtn.cloneNode(true);
    newSave.textContent = 'Actualizar Trade';
    newSave.onclick = () => {
      const oldNet = netProfit(trade);
      const tradesBefore = trades;
      trades = trades.filter(t => t.id != id);
      const lenWithoutOld = trades.length;
      saveTrade();
      if (trades.length === lenWithoutOld) { trades = tradesBefore; return; } // validación fallida o cancelado: se conserva el original
      
      // Revertir cambio en balance de la cuenta antigua (con el P&L neto anterior)
      const oldAcc = accounts.find(a => a.id == trade.accountId);
      if (oldAcc) {
        oldAcc.currentBalance = (parseFloat(oldAcc.currentBalance) - oldNet).toFixed(2);
      }
    };
    saveBtn.parentElement.replaceChild(newSave, saveBtn);
  }, 50);
}

function deleteTrade(id) {
  if (confirm('¿Borrar este trade? Se revertirá el balance de la cuenta.')) {
    const trade = trades.find(t => t.id == id);
    if (trade) {
      const acc = accounts.find(a => a.id == trade.accountId);
      if (acc) {
        acc.currentBalance = (parseFloat(acc.currentBalance || acc.startBalance) - netProfit(trade)).toFixed(2);
      }
    }
    trades = trades.filter(t => t.id != id);
    saveTrades();
    saveAccounts();
    showToast('Trade eliminado y balance revertido', 'error');
    render();
  }
}

function toggleAccCostField(typeSelectId, groupId) {
  const type = document.getElementById(typeSelectId)?.value;
  const group = document.getElementById(groupId);

  group.style.display = COST_APPLICABLE_TYPES.includes(type) ? '' : 'none';
}

// Muestra/oculta el campo de costo por trade según el tipo de la cuenta seleccionada,
// y sugiere como valor inicial el promedio de la cuenta (editable para dejar el valor exacto).
function onTradeAccountChange() {
  const accId = document.getElementById('trade_account')?.value;
  const acc = accounts.find(a => a.id == accId);
  const group = document.getElementById('trade_cost_group');
  const costInput = document.getElementById('trade_cost');
  if (!group || !costInput) return;
  if (acc && COST_APPLICABLE_TYPES.includes(acc.type)) {
    group.style.display = '';
    if (!costInput.dataset.userEdited) {
      // Con 5+ trades reales cargados, el promedio real manda sobre el número fijo declarado en la cuenta.
      const real = getRealAvgCommission(accId);
      costInput.value = (real && real.count >= 5) ? real.avg.toFixed(2) : (acc.avgCost || '');
    }
  } else {
    group.style.display = 'none';
    costInput.value = '';
  }
}

function addAccount() {
  const name = document.getElementById('acc_name')?.value;
  const broker = document.getElementById('acc_broker')?.value;
  const balance = document.getElementById('acc_balance')?.value;
  const type = document.getElementById('acc_type')?.value || 'Live';
  const avgCost = COST_APPLICABLE_TYPES.includes(type) ? (parseFloat(document.getElementById('acc_cost')?.value) || 0) : 0;
  
  if (!name || !balance) {
    showToast('Completa los campos', 'error');
    return;
  }
  
  accounts.unshift({
    id: Date.now(),
    name, broker, startBalance: balance, currentBalance: balance, type: type, avgCost: avgCost
  });
  
  // Limpiar formulario
  document.getElementById('acc_name').value = '';
  document.getElementById('acc_balance').value = '';
  if (document.getElementById('acc_cost')) document.getElementById('acc_cost').value = '';
  
  saveAccounts();
  showToast(`Cuenta "${name}" creada con $${balance}`, 'success');
  render();
}

function removeAccount(id) {
  const acc = accounts.find(a => a.id == id);
  if (!acc) return;
  const orphanCount = trades.filter(t => t.accountId == id).length;
  const warning = orphanCount > 0
    ? `¿Borrar la cuenta "${acc.name}"?\n\n⚠️ Tiene ${orphanCount} trade(s) asociados. NO se borrarán, pero quedarán sin cuenta asignada.`
    : `¿Borrar la cuenta "${acc.name}"?`;
  if (!confirm(warning)) return;
  accounts = accounts.filter(a => a.id != id);
  if (selectedAccount == id) selectedAccount = null; // evita quedar filtrando por una cuenta que ya no existe
  saveAccounts();
  showToast('Cuenta eliminada', 'error');
  render();
}

}

function csvEscape(value) {
  const s = (value === null || value === undefined) ? '' : String(value);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportData(format) {
  if (format === 'json') {
    const data = { trades, accounts, settings, exportedAt: new Date().toISOString(), version: 'tj-2.1' };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    download(blob, `trading-journal-${new Date().toISOString().slice(0, 10)}.json`);
    localStorage.setItem('tj_last_backup', new Date().toISOString());
  } else if (format === 'csv') {
    const headers = ['Fecha','Cuenta','Par','Lado','Entrada','Salida','Cantidad','Ganancia Bruta','Costo (Com.+Swap)','Ganancia Neta','Riesgo($)','R Realizado','R Máximo','Resultado','Sesión','Modelo','Timeframe','Link Gráfico','Notas'];
    const rows = trades.map(t => {
      const resultado = tradeSign(t) > 0 ? 'WIN' : tradeSign(t) < 0 ? 'LOSS' : 'BE';
      const cost = (t.cost !== undefined && t.cost !== null) ? t.cost : getTradeCost(t);
      return [
        t.date, accounts.find(a => a.id == t.accountId)?.name || '', t.pair, t.side, t.entryPrice, t.exitPrice, t.quantity,
        (t.profit || 0).toFixed(2), cost.toFixed(2), netProfitReal(t).toFixed(2), t.riskAmount || '', (t.rMultiple !== null && t.rMultiple !== undefined) ? t.rMultiple.toFixed(2) : '',
        t.maxRMultiple || '', resultado, t.session, t.model, t.timeframe, t.chartUrl || '', t.notes
      ];
    });
    // BOM al inicio para que Excel detecte UTF-8 y muestre bien tildes/ñ
    const csv = '\ufeff' + [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    download(blob, `trades-${new Date().toISOString().slice(0, 10)}.csv`);
  }
  showToast(`Descarga: ${format.toUpperCase()}`, 'success');
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a); // requerido por Firefox para que el click dispare la descarga
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('Esto reemplazará TODOS tus trades y cuentas actuales con los del backup. ¿Continuar?')) {
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== 'object') throw new Error('Formato inválido');
      if (!Array.isArray(data.trades) || !Array.isArray(data.accounts)) {
        throw new Error('El archivo no tiene la estructura esperada (trades/accounts)');
      }
      trades = data.trades;
      accounts = data.accounts;
      settings = data.settings && typeof data.settings === 'object' ? data.settings : settings;
      selectedAccount = null; dateFrom = null; dateTo = null; journalSearch = '';
      saveTrades();
      saveAccounts();
      saveSettings();
      showToast(`Restaurado: ${trades.length} trades, ${accounts.length} cuentas`, 'success');
      render();
    } catch (err) {
      showToast('Error al restaurar archivo: ' + err.message, 'error');
    } finally {
      event.target.value = ''; // permite volver a seleccionar el mismo archivo si hace falta reintentar
    }
  };
  reader.onerror = () => showToast('No se pudo leer el archivo', 'error');
  reader.readAsText(file);
}

function computeZellaScore(m) {
  const winRateScore = Math.max(0, Math.min(100, m.winRate || 0));
  const profitFactorScore = Math.max(0, Math.min(100, (m.profitFactor || 0) / 3 * 100));
  const avgWinLoss = (m.avgLoss && m.avgLoss !== 0) ? Math.abs(m.avgWin / m.avgLoss) : 0;
  const winLossScore = Math.max(0, Math.min(100, avgWinLoss / 3 * 100));
  const drawdownScore = Math.max(0, Math.min(100, 100 - Math.abs(m.maxDD || 0) * 2));
  const riskRewardScore = Math.max(0, Math.min(100, (parseFloat(m.payoffR) || parseFloat(m.rrRatio) || 0) / 3 * 100));
  const consistencyScore = Math.max(0, Math.min(100, (m.expectancy || 0) >= 0 ? Math.min(100, 50 + (m.kelly || 0)) : Math.max(0, 50 + (m.kelly || 0))));
  const values = [winRateScore, profitFactorScore, winLossScore, drawdownScore, riskRewardScore, consistencyScore];
  const overall = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(2);
  return {
    labels: ['Win Rate', 'Profit Factor', 'Avg Win/Loss', 'Drawdown', 'Risk/Reward', 'Consistencia'],
    values, overall
  };
}

function renderCharts() {
  setTimeout(() => {
    const modelCanvas = document.getElementById('model-compare-chart');
    if (modelCanvas && typeof Chart !== 'undefined') {
      if (modelCompareChartInstance) { modelCompareChartInstance.destroy(); modelCompareChartInstance = null; }
      const byModelChart = calculateByModel();
      modelCompareChartInstance = new Chart(modelCanvas, {
        type: 'bar',
        data: {
          labels: byModelChart.map(b => b.model),
          datasets: [{
            label: 'P&L por Estrategia',
            data: byModelChart.map(b => b.pnl),
            backgroundColor: byModelChart.map(b => b.pnl >= 0 ? 'rgba(111,162,135,0.7)' : 'rgba(193,85,74,0.7)'),
            borderColor: byModelChart.map(b => b.pnl >= 0 ? '#6FA287' : '#C1554A'),
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } },
            x: { grid: { display: false }, ticks: { color: '#8891A0' } }
          }
        }
      });
    }
    const monthlyCanvas = document.getElementById('monthly-chart');
    if (monthlyCanvas && typeof Chart !== 'undefined') {
      if (monthlyChartInstance) { monthlyChartInstance.destroy(); monthlyChartInstance = null; }
      const byMonth = {};
      getFilteredTrades().forEach(t => {
        const ym = (t.date || '').slice(0, 7);
        byMonth[ym] = (byMonth[ym] || 0) + netProfit(t);
      });
      const months = Object.keys(byMonth).sort();
      monthlyChartInstance = new Chart(monthlyCanvas, {
        type: 'bar',
        data: {
          labels: months,
          datasets: [{
            label: 'P&L Mensual',
            data: months.map(mo => byMonth[mo]),
            backgroundColor: months.map(mo => byMonth[mo] >= 0 ? 'rgba(111,162,135,0.7)' : 'rgba(193,85,74,0.7)'),
            borderColor: months.map(mo => byMonth[mo] >= 0 ? '#6FA287' : '#C1554A'),
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } },
            x: { grid: { display: false }, ticks: { color: '#8891A0' } }
          }
        }
      });
    }
    const zellaCanvas = document.getElementById('zella-chart');
    if (zellaCanvas && typeof Chart !== 'undefined') {
      if (zellaChartInstance) { zellaChartInstance.destroy(); zellaChartInstance = null; }
      const z = computeZellaScore(calculateMetrics(true));
      zellaChartInstance = new Chart(zellaCanvas, {
        type: 'radar',
        data: {
          labels: z.labels,
          datasets: [{
            label: 'Puntaje',
            data: z.values,
            borderColor: '#E3A857',
            backgroundColor: 'rgba(227,168,87,0.2)',
            pointBackgroundColor: '#E3A857',
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              min: 0, max: 100,
              grid: { color: '#2A3140' },
              angleLines: { color: '#2A3140' },
              pointLabels: { color: '#8891A0', font: { size: 9 } },
              ticks: { display: false, backdropColor: 'transparent' }
            }
          }
        }
      });
    }
    const pnlCanvas = document.getElementById('pnl-chart');
    const ddCanvas = document.getElementById('dd-chart');
    const chartTrades = getFilteredTrades();
    if (typeof Chart === 'undefined') {
      // Chart.js no cargó (sin conexión / CDN bloqueado) - degradamos con un aviso en vez de romper la app
      if (pnlCanvas) {
        pnlCanvas.parentElement.innerHTML = '<div class="empty">📡 No se pudo cargar la librería de gráficos (revisa tu conexión a internet)</div>';
      }
      return;
    }
    if (pnlChartInstance) { pnlChartInstance.destroy(); pnlChartInstance = null; }
    if (ddChartInstance) { ddChartInstance.destroy(); ddChartInstance = null; }
    if (pnlCanvas && chartTrades.length > 0) {
      const orderedTrades = chronoTrades(chartTrades); // cronológico por fecha
      const pnlTrend = orderedTrades.map((t, i) => 
        orderedTrades.slice(0, i + 1).reduce((s, x) => s + netProfit(x), 0)
      );
      
      pnlChartInstance = new Chart(pnlCanvas, {
        type: 'line',
        data: {
          labels: orderedTrades.map(t => t.date),
          datasets: [{
            label: 'P&L Acumulado',
            data: pnlTrend,
            borderColor: '#E3A857',
            backgroundColor: 'rgba(227,168,87,0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 3,
            pointBackgroundColor: '#E3A857'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } },
            x: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } }
          }
        }
      });

      // Drawdown desde máximo acumulado: para cada punto, % de caída respecto al peak anterior
      // Drawdown % sobre el equity real (balance inicial + P&L acumulado), no sobre el P&L solo.
      const sb = getStartBalance(chartTrades);
      let peak = -Infinity;
      const ddTrend = pnlTrend.map(v => {
        const eq = sb + v;
        if (eq > peak) peak = eq;
        return peak > 0 ? ((eq - peak) / peak) * 100 : 0;
      });

      if (ddCanvas) {
        ddChartInstance = new Chart(ddCanvas, {
          type: 'line',
          data: {
            labels: orderedTrades.map(t => t.date),
            datasets: [{
              label: 'Drawdown %',
              data: ddTrend,
              borderColor: '#C1554A',
              backgroundColor: 'rgba(193,85,74,0.15)',
              fill: true,
              tension: 0.3,
              pointRadius: 2,
              pointBackgroundColor: '#C1554A'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0', callback: v => v.toFixed(0) + '%' } },
              x: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } }
            }
          }
        });
      }
    } else if (ddCanvas) {
      ddCanvas.parentElement.innerHTML = '<div class="empty">Sin trades para calcular drawdown</div>';
    }

    // Histograma de R-Multiple (solo en tab Stats)
    const rmultCanvas = document.getElementById('rmult-chart');
    if (rmultChartInstance) { rmultChartInstance.destroy(); rmultChartInstance = null; }
    if (rmultCanvas) {
      const rTrades = chartTrades.filter(t => t.rMultiple !== null && t.rMultiple !== undefined && !isNaN(t.rMultiple));
      if (rTrades.length > 0) {
        const buckets = [
          { label: '< -2R', min: -Infinity, max: -2, count: 0 },
          { label: '-2R a -1R', min: -2, max: -1, count: 0 },
          { label: '-1R a 0R', min: -1, max: 0, count: 0 },
          { label: '0R a 1R', min: 0, max: 1, count: 0 },
          { label: '1R a 2R', min: 1, max: 2, count: 0 },
          { label: '2R a 3R', min: 2, max: 3, count: 0 },
          { label: '> 3R', min: 3, max: Infinity, count: 0 },
        ];
        rTrades.forEach(t => {
          const rr2 = Math.round(t.rMultiple * 100) / 100; // evita que un SL de -1.0000001R caiga en otro rango que uno de -1.00R
          const b = buckets.find(b => rr2 >= b.min && rr2 < b.max) || buckets[buckets.length - 1];
          b.count++;
        });
        rmultChartInstance = new Chart(rmultCanvas, {
          type: 'bar',
          data: {
            labels: buckets.map(b => b.label),
            datasets: [{
              label: 'Trades',
              data: buckets.map(b => b.count),
              backgroundColor: buckets.map(b => b.max <= 0 ? 'rgba(193,85,74,0.6)' : 'rgba(111,162,135,0.6)'),
              borderColor: buckets.map(b => b.max <= 0 ? '#C1554A' : '#6FA287'),
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0', stepSize: 1 } },
              x: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } }
            }
          }
        });
      } else {
        rmultCanvas.parentElement.innerHTML = '<div class="empty">Sin trades con R Multiple registrado</div>';
      }
    }

    // Comparación de cuentas: P&L acumulado de cada cuenta en el mismo gráfico (solo en tab Cuentas)
    const compareCanvas = document.getElementById('compare-chart');
    if (compareChartInstance) { compareChartInstance.destroy(); compareChartInstance = null; }
    if (compareCanvas) {
      const palette = ['#E3A857', '#6FA287', '#C1554A', '#8891A0', '#7FA7C9', '#B98BC9', '#D9A066', '#5FBFAE'];
      const datasets = accounts.map((acc, idx) => {
        const accTrades = chronoTrades(trades.filter(t => t.accountId == acc.id)); // cronológico por fecha
        let running = 0;
        const data = accTrades.map(t => { running += netProfit(t); return running; });
        return {
          label: acc.name,
          data,
          borderColor: palette[idx % palette.length],
          backgroundColor: 'transparent',
          fill: false,
          tension: 0.3,
          pointRadius: 2
        };
      });
      const maxLen = datasets.length ? Math.max(0, ...datasets.map(d => d.data.length)) : 0;
      if (maxLen > 0) {
        compareChartInstance = new Chart(compareCanvas, {
          type: 'line',
          data: {
            labels: Array.from({ length: maxLen }, (_, i) => `#${i + 1}`),
            datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: true, labels: { color: '#8891A0', font: { size: 10 } } } },
            scales: {
              y: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } },
              x: { grid: { color: '#2A3140' }, ticks: { color: '#8891A0' } }
            }
          }
        });
      } else {
        compareCanvas.parentElement.innerHTML = '<div class="empty">Crea al menos una cuenta con trades para comparar</div>';
      }
    }
  }, 50);
}

<script>
function openMacroTerminal(){
  try{
    var b64 = document.getElementById('macro-terminal-data').textContent;
    var binary = atob(b64);
    var len = binary.length;
    var bytes = new Uint8Array(len);
    for (var i=0;i<len;i++){ bytes[i] = binary.charCodeAt(i); }
    var html = new TextDecoder('utf-8').decode(bytes);
    // blob: URLs fallan (aparecen como "blob:null/...") en webviews sin origin propio.
    // document.write directo en la ventana nueva funciona en todos los navegadores.
    var win = window.open('', '_blank');
    if(!win) throw new Error('El navegador bloqueó la ventana emergente (revisa el bloqueador de pop-ups)');
    win.document.open();
    win.document.write(html);
    win.document.close();
  }catch(e){
    alert('No se pudo abrir la Terminal Macro: ' + e.message);
  }
}
</script>
